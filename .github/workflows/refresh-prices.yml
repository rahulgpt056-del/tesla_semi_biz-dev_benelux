name: Weekly price refresh

# Refreshes volatile public assumptions (diesel/electricity) and commits the
# result, which triggers Streamlit Community Cloud to auto-redeploy.
on:
  schedule:
    - cron: "0 6 * * 1"      # every Monday 06:00 UTC
  workflow_dispatch: {}       # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh prices
        run: python scripts/refresh_prices.py

      - name: Run engine tests (guard against bad data)
        run: python tests/test_tco_engine.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data/assumptions.json; then
            git add data/assumptions.json
            git commit -m "chore: weekly price refresh"
            git push
          else
            echo "No price change this week."
          fi
